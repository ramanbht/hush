<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hush</title>
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="app" data-state="loading">
    <header class="brand">
      <img src="../icons/icon32.png" width="18" height="18" alt="">
      <span>Hush</span>
    </header>

    <section class="site">
      <h1 id="site">&nbsp;</h1>
      <p id="status" class="status">&nbsp;</p>
    </section>

    <button id="mute" class="mute" role="switch" aria-checked="true" aria-describedby="status">
      <span class="mute-track"><span class="mute-knob"></span></span>
      <span class="mute-label" id="mute-label">Blocking on this site</span>
    </button>

    <button id="pick" class="button pick">Hide an element on this page</button>

    <footer>
      <a href="#" id="settings">Settings</a>
      <span id="count-note" class="note"></span>
    </footer>
  </main>
  <script src="../shared/abp.js"></script>
  <script src="popup.js"></script>
</body>
</html>
